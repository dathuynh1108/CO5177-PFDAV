name: Coursework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  coursework:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-studies.txt
      - run: pip install --no-deps -e .
      - run: python -m compileall -q src scripts
      - run: python -m pytest -q
      - name: Validate current notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for name in ('tabular', 'text', 'image'):
              notebook = nbformat.read(Path('notebooks') / f'{name}.ipynb', as_version=4)
              nbformat.validate(notebook)
              assert not any(output.output_type == 'error' for cell in notebook.cells if cell.cell_type == 'code' for output in cell.get('outputs', [])), name
          PY
      - run: python scripts/check_site.py
